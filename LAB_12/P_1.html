<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
</head>
<body>

    <h1 id="myh1">Hello world</h1>
   

    <button id="mybtn1">fade in</button>
    <button id="mybtn2">fade toggle</button>
    <button id="mybtn3">fade out</button>
    <button id="mybtn4">fade to</button>

    


    <script>
        $("#mybtn1").click(()=>{
            $("#myh1").fadeIn(1000);
        })
        $("#mybtn2").click(()=>{
            $("#myh1").fadeToggle(1000);
        })
        $("#mybtn3").click(()=>{
            $("#myh1").fadeOut(1000);
        })
        $("#mybtn4").click(()=>{
            $("#myh1").fadeTo(3000 , 0.3);
        })

        

    </script>
</body>
</html>
